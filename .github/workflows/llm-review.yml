name: Revue de Code par IA et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

permissions:
  pull-requests: write
  contents: read

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Pull Request Diff
        id: get_diff
        run: |
          # Obtenir le diff entre la branche de base (develop) et la branche de la PR
          git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > pr_diff.txt

          # Lire le diff
          DIFF_CONTENT=$(cat pr_diff.txt)

          # Échapper le contenu pour le passer aux étapes suivantes
          ESCAPED_DIFF="${DIFF_CONTENT//'%'/'%25'}"
          ESCAPED_DIFF="${ESCAPED_DIFF//$'\n'/'%0A'}"
          ESCAPED_DIFF="${ESCAPED_DIFF//$'\r'/'%0D'}"

          echo "diff_content=$ESCAPED_DIFF" >> $GITHUB_OUTPUT

      - name: Call Gemini API for Code Review
        id: call_llm
        env:
          PROMPT_TEXT: "Tu es un relecteur de code expert en Python et FastAPI. Analyse ce diff. Si le code est bon, fournis des pistes d’amélioration. Si le code contient des bugs ou des mauvaises pratiques, liste-les clairement. Réponds en français et utilise du Markdown pour formater ta réponse."
          DIFF_CONTENT: ${{ steps.get_diff.outputs.diff_content }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Installation de jq pour manipuler le JSON
          sudo apt-get update && sudo apt-get install -y jq

          # Construction du payload JSON sur une seule ligne pour éviter les erreurs de syntaxe shell
          # Note: Les variables d'environnement sont utilisées directement dans la chaîne
          echo '{"contents": [ { "parts": [ { "text": "'"$PROMPT_TEXT"'" }, { "text": "'"$DIFF_CONTENT"'" } ] } ] }' > payload.json

          # Appel à l'API Gemini
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json  )

          # Extraction de la réponse textuelle
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "⚠️ Erreur : Impossible d’analyser la réponse de Gemini."')

          # Gestion des erreurs API
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            REVIEW_TEXT="🚨 **Erreur Gemini API** : $ERROR"
          fi

          # --- Préparation des Outputs ---

          # 1. Output pour le commentaire GitHub (Markdown)
          echo "review_text<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 2. Output pour l'email (HTML)
          # Remplacement des sauts de ligne par
          et des **gras** par <strong>
          HTML_REVIEW_TEXT=$(echo "$REVIEW_TEXT" | sed ':a;N;$!ba;s/\n/
          /g' | sed 's/\*\*(.*)\*\*/<strong>\1<\/strong>/g')

          echo "html_review_text<<EOF" >> $GITHUB_OUTPUT
          echo "$HTML_REVIEW_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          REVIEW_TEXT: ${{ steps.call_llm.outputs.review_text }}
        with:
          script: |
            const reviewText = process.env.REVIEW_TEXT || "Aucune revue générée.";
            const reviewBody = `### 🤖 Revue de code par l'IA (Gemini)\n\nBonjour @${{ github.actor }} !\n\nVoici l'analyse automatique :\n\n---\n\n${reviewText}\n\n---\n_Généré par ${{ github.workflow }}_`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewBody
            });

      - name: Send Email Notification (HTML)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🤖 Revue IA • PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>
          content_type: text/html
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <style>
                body { font-family: sans-serif; background-color: #f6f8fa; margin: 0; padding: 20px; }
                .container { max-width: 680px; margin: auto; background: white; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.07); }
                .header { background: #24292e; color: white; padding: 20px; text-align: center; border-top-left-radius: 8px; border-top-right-radius: 8px; }
                .header h1 { margin: 0; font-size: 22px; }
                .content { padding: 25px; }
                .content h2 { color: #0366d6; border-bottom: 1px solid #eaecef; padding-bottom: 10px; }
                .pr-info { background: #f1f8ff; padding: 15px; border-radius: 6px; margin-bottom: 20px; line-height: 1.5; }
                pre { background-color: #f6f8fa; padding: 16px; overflow: auto; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; }
                .footer { padding: 20px; text-align: center; font-size: 12px; color: #6a737d; }
                a { color: #0366d6; text-decoration: none; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header"><h1>Revue de Code par l'IA</h1></div>
                <div class="content">
                  <div class="pr-info">
                    <strong>Pull Request :</strong> <a href="${{ github.event.pull_request.html_url }}">#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}</a>


                    <strong>Auteur :</strong> @${{ github.actor }}
                  </div>
                  <h2>Analyse de Gemini</h2>
                  <pre>${{ steps.call_llm.outputs.html_review_text }}</pre>
                </div>
                <div class="footer">
                  Généré par le workflow "${{ github.workflow }}"
                </div>
              </div>
            </body>
            </html>
