name: Revue de Code par LLM et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Nécessaire pour obtenir le diff complet

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies for LLM
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Get Diff
      id: get_diff
      run: |
        # Obtenir le diff entre la branche de base (develop) et la branche de la PR
        DIFF=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
        # Échapper le diff pour qu'il puisse être passé en argument du script
        ESCAPED_DIFF="${DIFF//'%'/'%25'}"
        ESCAPED_DIFF="${ESCAPED_DIFF//$'\n'/'%0A'}"
        ESCAPED_DIFF="${ESCAPED_DIFF//$'\r'/'%0D'}"
        echo "DIFF_CONTENT=$ESCAPED_DIFF" >> $GITHUB_OUTPUT

    - name: Call LLM for Code Review
      id: llm_review
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Exécuter le script Python en passant le diff en argument
        # La réponse est stockée dans la variable REVIEW_RESPONSE
        REVIEW_RESPONSE=$(python llm_review.py "${{ steps.get_diff.outputs.DIFF_CONTENT }}")

        # Échapper la réponse pour la passer aux étapes suivantes
        ESCAPED_RESPONSE="${REVIEW_RESPONSE//'%'/'%25'}"
        ESCAPED_RESPONSE="${ESCAPED_RESPONSE//$'\n'/'%0A'}"
        ESCAPED_RESPONSE="${ESCAPED_RESPONSE//$'\r'/'%0D'}"
        echo "REVIEW_RESPONSE=$ESCAPED_RESPONSE" >> $GITHUB_OUTPUT

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${{ steps.llm_review.outputs.REVIEW_RESPONSE }}\n\nRevue générée par l'IA pour @${{ github.actor }}.`
          })

    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
        body: "Voici la revue générée par l'IA : \n\n ${{ steps.llm_review.outputs.REVIEW_RESPONSE }}"
        to: ${{ secrets.TEAM_EMAIL_LIST }}
        from: ${{ secrets.MAIL_USERNAME }}
        secure: true
